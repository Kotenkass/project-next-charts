---
# ---------------------------------------------------------------------------
# Ingress к инфраструктурным подам.
#
# default-deny-all (podSelector: {}) запрещает весь входящий трафик ко всем
# подам, включая PostgreSQL, Redis и ClickHouse. Чтобы сервисы могли к ним
# ходить, нужно явно разрешить входящие соединения от сервисов, которым это
# разрешено картой соединений из задачи 2.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: dev
  labels:
    app.kubernetes.io/part-of: project-next
    task: "14"
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # ← answers, analytics, web-admin, users
    - from:
        - podSelector:
            matchLabels:
              app: answers
        - podSelector:
            matchLabels:
              app: analytics
        - podSelector:
            matchLabels:
              app: web-admin
        - podSelector:
            matchLabels:
              app: users
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: dev
  labels:
    app.kubernetes.io/part-of: project-next
    task: "14"
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    # ← telegram-api, answers, scheduler, recommender, web-admin
    - from:
        - podSelector:
            matchLabels:
              app: telegram-api
        - podSelector:
            matchLabels:
              app: answers
        - podSelector:
            matchLabels:
              app: scheduler
        - podSelector:
            matchLabels:
              app: recommender
        - podSelector:
            matchLabels:
              app: web-admin
      ports:
        - protocol: TCP
          port: 6379
---
